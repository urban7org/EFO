<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#4a2224"/><stop offset="1" stop-color="#1a0b0c"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d680"/><stop offset="0.55" stop-color="#c9a24a"/><stop offset="1" stop-color="#8a6a24"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf5e6"/><stop offset="1" stop-color="#e8d9b8"/>
    </linearGradient>
  </defs>
  <!-- badge -->
  <circle cx="32" cy="32" r="31" fill="url(#brass)"/>
  <circle cx="32" cy="32" r="27.5" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#f3d680" stroke-opacity="0.35" stroke-width="1"/>
  <!-- back card -->
  <g transform="rotate(-14 32 34)">
    <rect x="16" y="14" width="24" height="34" rx="3.5" fill="url(#cream)" stroke="#b89a5a" stroke-width="1"/>
    <rect x="18.5" y="16.5" width="19" height="29" rx="2" fill="none" stroke="#c0392b" stroke-width="1.2"/>
  </g>
  <!-- front card -->
  <g transform="rotate(10 34 36)">
    <rect x="22" y="16" width="26" height="36" rx="3.5" fill="url(#cream)" stroke="#b89a5a" stroke-width="1"/>
    <path d="M35 24 l7 10 -7 10 -7 -10 z" fill="#c0392b"/>
    <text x="25.5" y="23.5" font-family="Georgia, serif" font-weight="700" font-size="7" fill="#c0392b">A</text>
  </g>
</svg>
