<style>
  :root{--bg:#f6f1ea;--card:#fffdf9;--ink:#2b2622;--muted:#7a6f66;--line:#e6ddd2}
  @media (prefers-color-scheme:dark){:root{--bg:#1b1816;--card:#262220;--ink:#f1ebe4;--muted:#a79b91;--line:#3a332f}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{max-width:1240px;margin:0 auto;padding:28px 16px 6px}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(28px,4vw,40px);margin:0}
  h1 small{display:block;font:13px/1.4 system-ui,sans-serif;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:6px}
  p{color:var(--muted);margin:10px 0 0}
  main{max-width:1240px;margin:0 auto;padding:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
  @media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}}
  figure{margin:0;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(60,40,30,.08),0 8px 24px rgba(60,40,30,.08)}
  figure a{display:block}
  figure img{display:block;width:100%;height:auto;background:var(--line)}
  figcaption{padding:8px 12px 10px;font-size:13px;color:var(--ink)}
  figcaption span{color:var(--muted);margin-right:8px;letter-spacing:.06em}
  footer{max-width:1240px;margin:0 auto;padding:4px 16px 32px;color:var(--muted);font-size:13px}
  .lb{position:fixed;inset:0;background:rgba(20,14,12,.94);display:none;align-items:center;justify-content:center;z-index:9}
  .lb.open{display:flex}
  .lb img{max-width:96vw;max-height:88vh;object-fit:contain;border-radius:6px}
  .lb .cap{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));color:#f1ebe4;font-size:14px;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.5))}
  .lb button{position:absolute;top:50%;transform:translateY(-50%);all:unset;cursor:pointer;color:#fff;font-size:34px;padding:10px 16px;position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.08);border-radius:10px}
  .lb .prev{left:10px} .lb .next{right:10px}
  .lb .close{top:10px;right:12px;transform:none;font-size:22px;padding:8px 12px}

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="close" id="close" aria-label="Close">✕</button>
  <button class="prev" id="prev" aria-label="Previous">‹</button>
  <img id="lbImg" alt="">
  <button class="next" id="next" aria-label="Next">›</button>
  <div class="cap" id="cap"></div>
</div>
<script>
(function(){
  var links = Array.prototype.slice.call(document.querySelectorAll("#grid a"));
  var lb = document.getElementById("lb"), img = document.getElementById("lbImg"), cap = document.getElementById("cap"), cur = -1;
  function show(i){ cur = (i + links.length) % links.length; var a = links[cur], im = a.querySelector("img");
    img.src = a.getAttribute("href"); img.alt = im.alt; cap.textContent = im.alt.replace(/^Photo /, "");
    lb.classList.add("open"); document.body.style.overflow = "hidden";
    var n = new Image(); n.src = links[(cur+1) % links.length].getAttribute("href"); }
  function close(){ lb.classList.remove("open"); document.body.style.overflow = ""; cur = -1; }
  links.forEach(function(a, i){ a.addEventListener("click", function(e){ e.preventDefault(); show(i); }); });
  document.getElementById("prev").addEventListener("click", function(){ show(cur - 1); });
  document.getElementById("next").addEventListener("click", function(){ show(cur + 1); });
  document.getElementById("close").addEventListener("click", close);
  lb.addEventListener("click", function(e){ if (e.target === lb) close(); });
  document.addEventListener("keydown", function(e){ if (cur < 0) return;
    if (e.key === "Escape") close(); else if (e.key === "ArrowRight") show(cur + 1); else if (e.key === "ArrowLeft") show(cur - 1); });
  var tx = null;
  lb.addEventListener("touchstart", function(e){ tx = e.touches[0].clientX; }, {passive:true});
  lb.addEventListener("touchend", function(e){ if (tx === null) return; var dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1)); tx = null; }, {passive:true});
})();
</script>
